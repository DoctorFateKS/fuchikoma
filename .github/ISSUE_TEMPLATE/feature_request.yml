name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion.

        Saitama keeps a small core and follows a written roadmap. A change that
        adds a public concept, breaks the API or adds a runtime dependency needs
        a public RFC: see the
        [RFC process](https://github.com/DoctorFateKS/saitama/blob/main/GOVERNANCE.md#the-rfc-process).
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues, the roadmap and the RFCs and found no duplicate.
          required: true
        - label: I have read the Code of Conduct and agree to follow it.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Saitama to do? Include a short code sketch if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how other frameworks handle this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - runtime
        - router
        - schema
        - data
        - scope
        - view
        - front
        - realtime
        - jobs
        - auth
        - ai
        - cli
        - test
        - obs
        - deploy
        - i18n
        - docs
        - governance
        - other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this myself.
