name: Release

# A release starts when a release manager pushes a signed tag named vX.Y.Z.
#
# - Tag push: verify the tag, build the gem and its SBOM, attest them, publish
#   the gem to RubyGems.org with trusted publishing, then create the GitHub
#   release with the gem, the SBOM and the checksums attached.
# - Manual run (workflow_dispatch): a dry run. It verifies, builds and attests
#   the gem and its SBOM and uploads them as a workflow artifact, but publishes
#   nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Check the release tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Check the version and the changelog (dry run)
        if: github.ref_type != 'tag'
        run: .github/scripts/check-release-tag.sh --dry-run

      - name: Check that the release notes can be extracted
        run: |
          version="$(ruby -Ilib -e 'require "fuchikoma/version"; print Fuchikoma::VERSION')"
          .github/scripts/release-notes.sh "v${version}" > /dev/null

      - name: RuboCop
        run: bundle exec rubocop

      - name: Steep
        run: bundle exec steep check

      - name: Tests
        run: bundle exec rake test

      - name: Install bundler-audit
        run: gem install bundler-audit --version "~> 0.9"

      - name: Check gems for known vulnerabilities
        run: bundle-audit check --update

  build:
    name: Build and attest the gem and its SBOM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # A fixed timestamp makes the gem reproducible: the same commit always
      # gives the same bytes, so the published gem can be compared with the
      # attested one.
      - name: Fix the build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build the gem and check that the build is reproducible
        run: |
          version="$(ruby -Ilib -e 'require "fuchikoma/version"; print Fuchikoma::VERSION')"
          mkdir -p dist
          gem build fuchikoma.gemspec --output "dist/fuchikoma-${version}.gem"
          gem build fuchikoma.gemspec --output "${RUNNER_TEMP}/second-build.gem"
          cmp "dist/fuchikoma-${version}.gem" "${RUNNER_TEMP}/second-build.gem"

      - name: Generate the CycloneDX SBOM
        run: |
          version="$(ruby -Ilib -e 'require "fuchikoma/version"; print Fuchikoma::VERSION')"
          .github/scripts/generate-sbom.sh \
            "dist/fuchikoma-${version}.cdx.json" \
            "dist/fuchikoma-${version}.gem"

      - name: Write the checksums
        working-directory: dist
        run: sha256sum fuchikoma-*.gem fuchikoma-*.cdx.json | tee SHA256SUMS

      - name: Attest the gem and the SBOM
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.gem
            dist/*.cdx.json

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to RubyGems.org
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Fix the build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # RubyGems.org lets trusted publishing create a new gem only if the
      # workflow names the account that will own it, and neither release-gem
      # nor configure-rubygems-credentials has an input for that yet. While the
      # repository variable RUBYGEMS_OWNER is set (first release only), the
      # token exchange is done here. Delete the variable once the gem exists.
      - name: Get a RubyGems API key to create the gem
        if: vars.RUBYGEMS_OWNER != ''
        env:
          RUBYGEMS_OWNER: ${{ vars.RUBYGEMS_OWNER }}
        run: |
          set -euo pipefail
          case "$RUBYGEMS_OWNER" in
            ''|*[!0-9]*)
              echo "::error::RUBYGEMS_OWNER must be the numeric RubyGems.org account ID"
              exit 1
              ;;
          esac
          jwt="$(curl -sS --fail \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r '.value')"
          echo "::add-mask::${jwt}"
          response="$(curl -sS --fail-with-body -X POST \
            https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}')")"
          if ! key="$(jq -er '.rubygems_api_key' <<< "$response")"; then
            echo "::error::Unexpected response from RubyGems.org (fields: $(jq -r 'keys | join(", ")' <<< "$response"))"
            exit 1
          fi
          echo "::add-mask::${key}"
          {
            echo "RUBYGEMS_API_KEY=${key}"
            echo "GEM_HOST_API_KEY=${key}"
            echo "BUNDLE_GEM__PUSH_KEY=${key}"
          } >> "$GITHUB_ENV"

      - name: Publish the gem
        uses: rubygems/release-gem@v1
        with:
          setup-trusted-publisher: ${{ vars.RUBYGEMS_OWNER == '' }}

      - name: Download the attested gem
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist

      - name: Check that the published gem is the attested gem
        run: |
          published="$(ls pkg/fuchikoma-*.gem)"
          cmp "$published" "${RUNNER_TEMP}/dist/$(basename "$published")"

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # dist/ holds the gem, its CycloneDX SBOM and the checksums: all three
      # become release assets. The notes are the changelog section of the
      # version, and every 0.x release is marked as a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "${RUNNER_TEMP}/release-notes.md"
          flags=()
          case "$GITHUB_REF_NAME" in
            v0.*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${flags[@]}"
